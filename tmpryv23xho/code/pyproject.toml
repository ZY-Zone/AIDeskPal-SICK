[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "aideskpal-sick"
version = "1.0.0"
description = "AIDeskPal-SICK — an AI-driven PMX desktop companion for Windows 10+"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "AIDeskPal-SICK" }]
keywords = ["pmx", "mmd", "desktop-pet", "ai", "pyside6", "windows"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Win32 (MS Windows)",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Desktop Environment",
]
dependencies = [
  "PySide6>=6.8,<6.13",
  "PyOpenGL>=3.1.7,<4",
  "numpy>=2.0,<3",
  "Pillow>=11,<13",
  "pystray>=0.19,<1",
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-qt>=4.4", "ruff>=0.8"]

[project.scripts]
aideskpal = "aideskpal.app:main"

[project.urls]
Homepage = "https://github.com/ZY-Zone/AIDeskPal-SICK"
Documentation = "http://sickcc.online/cwusr/"
Source = "https://github.com/ZY-Zone/AIDeskPal-SICK.git"

[tool.hatch.build.targets.wheel]
packages = ["src/aideskpal"]

# No testpaths entry: the repository ships the client only, and secondary
# developers point this at their own test tree.
[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-ra"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]
